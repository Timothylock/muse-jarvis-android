plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'dev.timlock.jarvis'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.timlock.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-m1'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
}
dependencies {
    implementation project(':core:model')
    implementation project(':core:transport-api')
    implementation project(':core:store')
    implementation project(':transport:sim')
    implementation project(':ui:hud')
    implementation project(':render:orb')
    implementation project(':audio')
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBom}")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation "androidx.core:core-ktx:${rootProject.ext.coreKtx}"
    implementation "androidx.activity:activity-compose:${rootProject.ext.activityCompose}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:${rootProject.ext.lifecycle}"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:${rootProject.ext.lifecycle}"
    implementation "androidx.datastore:datastore-preferences:${rootProject.ext.datastore}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${rootProject.ext.coroutines}"
}
