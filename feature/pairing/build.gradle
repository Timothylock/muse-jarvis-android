plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'dev.timlock.jarvis.feature.pairing'
    compileSdk 35
    defaultConfig { minSdk 26 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    api project(':core:model')
    api project(':core:transport-api')
    implementation project(':ui:hud')
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBom}")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation "androidx.core:core-ktx:${rootProject.ext.coreKtx}"
    implementation "androidx.activity:activity-compose:${rootProject.ext.activityCompose}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${rootProject.ext.coroutines}"
    testImplementation "junit:junit:${rootProject.ext.junit}"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${rootProject.ext.coroutines}"
}
