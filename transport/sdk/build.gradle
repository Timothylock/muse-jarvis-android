// M6: real SDK transport. Chaquopy (Python 3.11) + vendored upstream musegadget live ONLY in this module.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}
android {
    namespace 'dev.timlock.jarvis.transport.sdk'
    compileSdk 35
    defaultConfig {
        minSdk 26
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    api project(':core:model')
    api project(':core:transport-api')
    api project(':core:secure')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${rootProject.ext.coroutines}"
    testImplementation "junit:junit:${rootProject.ext.junit}"
}

chaquopy {
    defaultConfig {
        version = "3.11"
        buildPython("/usr/bin/python3")
        pip {
            install "cryptography==42.0.8"
            install "websockets==17.4"
        }
    }
}
