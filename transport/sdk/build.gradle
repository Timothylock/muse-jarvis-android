// M6 contract skeleton. Track S adds Chaquopy here (or reports why it must live in :app).
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'dev.timlock.jarvis.transport.sdk'
    compileSdk 35
    defaultConfig { minSdk 26 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    api project(':core:model')
    api project(':core:transport-api')
    api project(':core:secure')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${rootProject.ext.coroutines}"
    testImplementation "junit:junit:${rootProject.ext.junit}"
}
